name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install platformio intelhex

      - name: Run full repo verification
        run: ./scripts/verify-repo.sh --full

      - name: Build firmware artifacts
        run: |
          PLATFORMIO_CORE_DIR="$PWD/.platformio" \
            PLATFORMIO_SETTING_ENABLE_TELEMETRY=no \
            pio run -e logger-nodemcuv2 -e logger-esp32 -e logger-tinyc6 -e dash-waveshare-s3-128

      - name: Verify gauge JSON integration with installed dependencies
        run: ./scripts/run-host-tests.sh

      - name: Prepare firmware artifacts
        run: |
          mkdir -p dist
          cp .pio/build/logger-nodemcuv2/firmware.bin dist/apexi-logger-nodemcuv2-firmware.bin
          cp .pio/build/logger-nodemcuv2/firmware.elf dist/apexi-logger-nodemcuv2-firmware.elf
          cp .pio/build/logger-esp32/firmware.bin dist/apexi-logger-esp32-firmware.bin
          cp .pio/build/logger-esp32/firmware.elf dist/apexi-logger-esp32-firmware.elf
          cp .pio/build/logger-tinyc6/firmware.bin dist/apexi-logger-tinyc6-firmware.bin
          cp .pio/build/logger-tinyc6/firmware.elf dist/apexi-logger-tinyc6-firmware.elf
          cp .pio/build/logger-tinyc6/firmware.factory.bin dist/apexi-logger-tinyc6-factory.bin
          cp .pio/build/dash-waveshare-s3-128/firmware.bin dist/apexi-dash-waveshare-s3-128-firmware.bin
          cp .pio/build/dash-waveshare-s3-128/firmware.elf dist/apexi-dash-waveshare-s3-128-firmware.elf
          cp .pio/build/dash-waveshare-s3-128/firmware.factory.bin dist/apexi-dash-waveshare-s3-128-factory.bin
          python .platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            --output dist/apexi-logger-esp32-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x1000 .pio/build/logger-esp32/bootloader.bin \
            0x8000 .pio/build/logger-esp32/partitions.bin \
            0xe000 .platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/logger-esp32/firmware.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-logger-nodemcuv2-logger-esp32-logger-tinyc6-dash-waveshare-s3-128
          path: dist/*
          if-no-files-found: error
