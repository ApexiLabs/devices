name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            .platformio/.cache
            .platformio/packages
            .platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install platformio intelhex "rich-click<2" "click<9"

      - name: Verify public-key release evidence tooling
        run: |
          python -m venv .verification-venv
          .verification-venv/bin/pip install -r requirements-production-verification.txt
          .verification-venv/bin/python -m unittest tests/test_signed_release_crypto.py

      - name: Run full repo verification
        run: ./scripts/verify-repo.sh --full

      - name: Build firmware artifacts
        run: |
          PLATFORMIO_CORE_DIR="$PWD/.platformio" \
            PLATFORMIO_SETTING_ENABLE_TELEMETRY=no \
            pio run -e logger-nodemcuv2 -e logger-esp32 -e logger-tinyc6 -e dash-waveshare-s3-128 -e logger-esp32-production-candidate

      - name: Verify gauge JSON integration with installed dependencies
        run: ./scripts/run-host-tests.sh

      - name: Prepare firmware artifacts
        run: |
          mkdir -p dist
          cp .pio/build/logger-nodemcuv2/firmware.bin dist/apexi-logger-nodemcuv2-firmware.bin
          cp .pio/build/logger-nodemcuv2/firmware.elf dist/apexi-logger-nodemcuv2-firmware.elf
          cp .pio/build/logger-esp32/firmware.bin dist/apexi-logger-esp32-firmware.bin
          cp .pio/build/logger-esp32/firmware.elf dist/apexi-logger-esp32-firmware.elf
          cp .pio/build/logger-tinyc6/firmware.bin dist/apexi-logger-tinyc6-firmware.bin
          cp .pio/build/logger-tinyc6/firmware.elf dist/apexi-logger-tinyc6-firmware.elf
          cp .pio/build/logger-tinyc6/firmware.factory.bin dist/apexi-logger-tinyc6-factory.bin
          cp .pio/build/dash-waveshare-s3-128/firmware.bin dist/apexi-dash-waveshare-s3-128-firmware.bin
          cp .pio/build/dash-waveshare-s3-128/firmware.elf dist/apexi-dash-waveshare-s3-128-firmware.elf
          cp .pio/build/dash-waveshare-s3-128/firmware.factory.bin dist/apexi-dash-waveshare-s3-128-factory.bin
          # Platform output uses the selected SDK's actual bootloader offsets.
          cp .pio/build/logger-esp32/firmware.factory.bin dist/apexi-logger-esp32-factory.bin
          python scripts/check_production_security.py \
            .platformio/packages/framework-arduinoespressif32-libs/esp32/sdkconfig \
            --build-flags '-D APEXI_PRODUCTION_SECURITY_REQUIRED=1' --json \
            > dist/esp32-security-classification.json

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-logger-nodemcuv2-logger-esp32-logger-tinyc6-dash-waveshare-s3-128
          path: dist/*
          if-no-files-found: error

      - name: Upload Logger artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apexi-logger-firmware
          path: |
            dist/apexi-logger-*
            dist/esp32-security-classification.json
          if-no-files-found: error

      - name: Upload Dash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apexi-dash-firmware
          path: dist/apexi-dash-*
          if-no-files-found: error
