[platformio]
default_envs = logger-nodemcuv2

[env:logger-nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D USER_SETUP_LOADED
  -D TFT_WIDTH=480
  -D TFT_HEIGHT=320
  -include include/LoggerDisplayTFTSetup.h
lib_deps =
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/RTClib@^2.1.4
  bodmer/TFT_eSPI@^2.5.43
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

[env:logger-nodemcuv2-ota]
extends = env:logger-nodemcuv2
upload_protocol = espota

[env:logger-esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions/esp32-16mb-store-forward.csv
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D MDA_HEADLESS_DISPLAY=1
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_deps =
  Preferences
  Networking
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/RTClib@^2.1.4
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

[env:logger-tinyc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = um_tinyc6
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.wait_for_upload_port = false
lib_ldf_mode = chain+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MDA_HEADLESS_DISPLAY=1
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_deps =
  FS
  Networking
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/RTClib@^2.1.4
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

[env:dash-waveshare-s3-128]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_speed = 460800
build_src_filter =
  +<dash_main.cpp>
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MDA_WAVESHARE_DASH=1
  -D USE_FSPI_PORT
  -D USER_SETUP_LOADED
  -include include/WaveshareDashTFTSetup.h
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5
